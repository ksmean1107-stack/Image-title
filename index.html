<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Renamer Pro</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #111111;
            --border-color: #333333;
            --text-main: #ffffff;
            --text-muted: #999999;
            --accent-color: #0070f3;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        
        .upload-section { display: flex; flex-direction: column; align-items: center; padding: 30px; border: 2px dashed var(--border-color); border-radius: 12px; cursor: pointer; }
        
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        input, select { background: #000; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; }
        
        .btn { background: var(--text-main); color: #000; border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--accent-color); color: #fff; }

        .file-list { display: flex; flex-direction: column; gap: 10px; }
        .file-row { display: flex; align-items: center; gap: 10px; padding: 10px; background: #000; border-radius: 6px; font-size: 13px; }
        .file-row input { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <label class="upload-section">
            <input type="file" id="imageInput" multiple style="display: none;">
            <div>📁 이미지 선택</div>
        </label>
    </div>

    <div class="panel">
        <div class="settings-grid">
            <div class="input-group" style="grid-column: span 2;">
                <label>이름 패턴 ({NUMBER})</label>
                <input type="text" id="patternInput" value="image_{NUMBER}">
            </div>
            <div class="input-group">
                <label>시작 번호</label>
                <input type="number" id="startNum" value="1">
            </div>
            <div class="input-group">
                <label>패딩 (예: 2 -> 01)</label>
                <input type="number" id="padLen" value="2">
            </div>
        </div>
        <button class="btn" id="applyBtn">규칙 적용</button>
    </div>

    <div id="fileListContainer" class="panel" style="display: none;">
        <div class="file-list" id="fileList"></div>
        <button class="btn btn-primary" id="downloadAllBtn">다운로드 시작</button>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const fileList = document.getElementById('fileList');
    const downloadAllBtn = document.getElementById('downloadAllBtn');

    let uploadedFiles = [];

    // 파일 로드 시 콘솔 로그 출력
    imageInput.addEventListener('change', (e) => {
        uploadedFiles = Array.from(e.target.files);
        console.log("파일 업로드 완료. 총 파일 개수:", uploadedFiles.length);
        
        document.getElementById('fileListContainer').style.display = 'block';
        fileList.innerHTML = '';
        
        uploadedFiles.forEach((file, index) => {
            const row = document.createElement('div');
            row.className = 'file-row';
            row.innerHTML = `
                <input type="text" value="${file.name}" class="row-name">
            `;
            fileList.appendChild(row);
        });
    });

    // 다운로드 로직 (확장자 변경 시 MIME 타입 충돌 방지)
    downloadAllBtn.addEventListener('click', async () => {
        const rows = document.querySelectorAll('.row-name');
        console.log("다운로드 시작");

        for(let i = 0; i < uploadedFiles.length; i++) {
            const file = uploadedFiles[i];
            const newName = rows[i].value;
            
            console.log(`다운로드 중: ${newName}`);

            try {
                // Blob을 생성할 때 원본 파일의 타입을 그대로 유지
                const blob = new Blob([file], { type: file.type });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = newName; // 이름만 변경 (파일 데이터 변조 없음)
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                await new Promise(r => setTimeout(r, 500)); // 스팸 방지
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error(`파일 ${newName} 다운로드 중 오류 발생:`, err);
            }
        }
        console.log("모든 다운로드 작업 완료");
    });
</script>

</body>
</html>
