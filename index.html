<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Image Renamer</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #0a0a0a;
            --border-color: #333333;
            --text-main: #ededed;
            --text-muted: #888888;
            --accent-color: #0070f3;
            --accent-hover: #005bb5;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'Fira Code', 'Consolas', monospace;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .status-badge {
            font-family: var(--font-mono);
            font-size: 12px;
            background: #111;
            padding: 4px 10px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            color: var(--text-muted);
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            background-color: #050505;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-section:hover {
            border-color: var(--accent-color);
            background-color: #0a0a0a;
        }

        .upload-icon {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="number"],
        select {
            background-color: #000;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 13px;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .range-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .range-wrapper input {
            width: 100%;
        }

        .btn {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .btn:hover { opacity: 0.9; }
        
        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover { background-color: #111; }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-primary:hover { background-color: var(--accent-hover); }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .file-row img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .file-info {
            display: flex;
            flex: 1;
            gap: 12px;
        }

        .file-info input { flex: 1; }
        .file-info select { width: 90px; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Batch Image Renamer</h2>
        <span class="status-badge">v3.0.0-pro</span>
    </div>

    <div class="panel">
        <label class="upload-section">
            <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
            <div class="upload-icon">📁</div>
            <div style="font-size: 14px; color: var(--text-muted);">Click to upload files or drag and drop</div>
        </label>
    </div>

    <div class="panel">
        <div class="settings-grid">
            <div class="input-group" style="grid-column: 1 / -1;">
                <label>Naming Pattern ({NUMBER} will be replaced)</label>
                <input type="text" id="patternInput" value="원하는_제목을_적어주세요.-{NUMBER}">
            </div>
            
            <div class="input-group">
                <label>Number Range</label>
                <div class="range-wrapper">
                    <input type="number" id="startNum" value="1" min="0">
                    <span style="color: var(--text-muted);">~</span>
                    <input type="number" id="endNum" value="9" min="0">
                </div>
            </div>

            <div class="input-group">
                <label>Padding Length (e.g. 2 → 01)</label>
                <input type="number" id="padLen" value="2" min="1">
            </div>

            <div class="input-group">
                <label>Global Extension</label>
                <select id="globalExt">
                    <option value="">Keep Original</option>
                    <option value=".png">.png</option>
                    <option value=".jpg">.jpg</option>
                    <option value=".webp">.webp</option>
                </select>
            </div>
        </div>
        <button class="btn btn-outline" id="applyBtn">Apply Rules</button>
    </div>

    <div id="fileListContainer" class="panel" style="display: none;">
        <label style="display: block; margin-bottom: 16px;">Queue</label>
        <div class="file-list" id="fileList"></div>
        <div style="margin-top: 24px;">
            <button class="btn btn-primary" id="downloadAllBtn">Save to Folder (Direct Write)</button>
        </div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const fileList = document.getElementById('fileList');
    const fileListContainer = document.getElementById('fileListContainer');
    const applyBtn = document.getElementById('applyBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');

    let uploadedFiles = [];

    // 파일 업로드 처리
    imageInput.addEventListener('change', function(event) {
        const files = Array.from(event.target.files);
        if (files.length === 0) return;

        fileListContainer.style.display = 'block';

        files.forEach(file => {
            uploadedFiles.push(file);
            
            const originalName = file.name.substring(0, file.name.lastIndexOf('.'));
            const originalExt = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
            const objectURL = URL.createObjectURL(file);

            const row = document.createElement('div');
            row.className = 'file-row';
            row.innerHTML = `
                <img src="${objectURL}" alt="preview">
                <div class="file-info">
                    <input type="text" class="row-name" value="${originalName}">
                    <select class="row-ext">
                        <option value=".png" ${originalExt === '.png' ? 'selected' : ''}>.png</option>
                        <option value=".jpg" ${originalExt === '.jpg' || originalExt === '.jpeg' ? 'selected' : ''}>.jpg</option>
                        <option value=".webp" ${originalExt === '.webp' ? 'selected' : ''}>.webp</option>
                        <option value=".gif" ${originalExt === '.gif' ? 'selected' : ''}>.gif</option>
                    </select>
                </div>
            `;
            fileList.appendChild(row);
        });
        
        imageInput.value = '';
    });

    // 규칙 일괄 적용
    applyBtn.addEventListener('click', function() {
        const pattern = document.getElementById('patternInput').value;
        const start = parseInt(document.getElementById('startNum').value);
        const end = parseInt(document.getElementById('endNum').value);
        const pad = parseInt(document.getElementById('padLen').value);
        const globalExt = document.getElementById('globalExt').value;

        const rows = document.querySelectorAll('.file-row');
        let currentNum = start;

        rows.forEach(row => {
            if (currentNum > end) return; 

            const nameInput = row.querySelector('.row-name');
            const extSelect = row.querySelector('.row-ext');

            const paddedNum = String(currentNum).padStart(pad, '0');
            nameInput.value = pattern.replace('{NUMBER}', paddedNum);

            if (globalExt !== "") extSelect.value = globalExt;
            currentNum++;
        });
    });

    // [핵심 변경] File System Access API를 이용한 폴더 직접 저장
    downloadAllBtn.addEventListener('click', async function() {
        if (uploadedFiles.length === 0) return;

        // 브라우저 지원 여부 확인 (크롬, 엣지, 오페라 등 지원)
        if (!('showDirectoryPicker' in window)) {
            alert('현재 브라우저는 폴더 직접 저장 기능을 지원하지 않습니다. 크롬(Chrome)이나 엣지(Edge) 브라우저를 사용해주세요.');
            return;
        }

        try {
            // 1. 사용자에게 저장할 폴더를 선택하라는 창을 띄움
            const dirHandle = await window.showDirectoryPicker({
                mode: 'readwrite'
            });

            downloadAllBtn.textContent = 'Saving directly to folder...';
            downloadAllBtn.style.opacity = '0.5';
            downloadAllBtn.style.pointerEvents = 'none';

            const rows = document.querySelectorAll('.file-row');

            // 2. 선택한 폴더에 원본 파일 데이터를 다이렉트로 쓰기 (네트워크 경유 없음)
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const finalName = row.querySelector('.row-name').value.trim();
                const finalExt = row.querySelector('.row-ext').value;
                const file = uploadedFiles[i];

                if (finalName && file) {
                    const fullFileName = `${finalName}${finalExt}`;
                    
                    // 폴더 안에 빈 파일 생성
                    const fileHandle = await dirHandle.getFileHandle(fullFileName, { create: true });
                    // 쓰기 스트림 열기
                    const writable = await fileHandle.createWritable();
                    // 원본 파일 데이터 쓰기 (화질 100% 보존)
                    await writable.write(file);
                    // 스트림 닫기 (저장 완료)
                    await writable.close();
                }
            }

            downloadAllBtn.textContent = 'Saved Successfully!';
            downloadAllBtn.style.backgroundColor = '#10b981'; // 성공 시 녹색
            
        } catch (error) {
            // 사용자가 폴더 선택을 취소한 경우는 에러로 보지 않음
            if (error.name !== 'AbortError') {
                console.error(error);
                alert('파일 저장 중 오류가 발생했습니다.');
            }
        } finally {
            // 3초 뒤 버튼 상태 복구
            setTimeout(() => {
                downloadAllBtn.textContent = 'Save to Folder (Direct Write)';
                downloadAllBtn.style.backgroundColor = 'var(--accent-color)';
                downloadAllBtn.style.opacity = '1';
                downloadAllBtn.style.pointerEvents = 'auto';
            }, 3000);
        }
    });
</script>

</body>
</html>
