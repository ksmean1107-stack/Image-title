<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImageRename — 이미지 일괄 이름 변경</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #18181f;
      --border: #2a2a35;
      --border-bright: #3d3d4f;
      --accent: #7c6dfa;
      --accent2: #fa6d9e;
      --accent-glow: rgba(124,109,250,0.25);
      --text: #e8e8f0;
      --text-muted: #6e6e88;
      --text-dim: #3a3a4f;
      --success: #5af0a0;
      --mono: 'DM Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── BACKGROUND NOISE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* ── DECORATIVE GRADIENT ── */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,109,250,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 52px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .logo-tag {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .logo-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-badge {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 100px;
    }

    /* ── SECTION LABELS ── */
    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── UPLOAD ZONE ── */
    #dropzone {
      position: relative;
      border: 1.5px dashed var(--border-bright);
      border-radius: 16px;
      padding: 52px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--surface);
      overflow: hidden;
      margin-bottom: 32px;
    }

    #dropzone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(124,109,250,0.06), transparent 60%);
      pointer-events: none;
    }

    #dropzone:hover, #dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(124,109,250,0.05);
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(124,109,250,0.12);
    }

    #dropzone input { display: none; }

    .drop-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .drop-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .drop-sub {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── CONTROLS PANEL ── */
    .controls-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .field-hint {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    input[type="text"], input[type="number"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    input::placeholder { color: var(--text-dim); }

    .nb-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      gap: 10px;
      align-items: end;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .range-sep {
      font-family: var(--mono);
      font-size: 16px;
      color: var(--text-muted);
      padding-bottom: 10px;
      text-align: center;
    }

    /* ── BUTTONS ── */
    .btn {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 11px 20px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px rgba(124,109,250,0.35);
    }

    .btn-primary:hover {
      background: #9184fb;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(124,109,250,0.45);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: var(--border);
      color: var(--text);
    }

    .btn-sm {
      font-size: 11px;
      padding: 7px 12px;
      border-radius: 6px;
    }

    .btn-success {
      background: rgba(90,240,160,0.12);
      color: var(--success);
      border: 1px solid rgba(90,240,160,0.2);
    }

    .btn-success:hover {
      background: rgba(90,240,160,0.2);
    }

    /* ── IMAGE LIST ── */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .image-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 100px;
    }

    #image-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .image-item {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 14px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      transition: border-color 0.15s, background 0.15s;
      animation: slideIn 0.2s ease forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .image-item:hover { border-color: var(--border-bright); background: var(--surface2); }

    .thumb-wrap {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface2);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .item-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .item-index {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .item-name {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-original {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .bottom-info {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── EMPTY STATE ── */
    #empty-state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 12px;
      display: none;
    }

    #image-list:empty + #empty-state { display: block; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      border-radius: 10px;
      padding: 12px 18px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #toast.show { transform: translateY(0); opacity: 1; }
    #toast .toast-icon { font-size: 14px; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; gap: 16px; }
      .controls-grid { grid-template-columns: 1fr; }
      .nb-row { grid-template-columns: 1fr auto 1fr; grid-template-rows: auto auto; }
      .nb-row .padding-field { grid-column: 1 / -1; }
      .image-item { grid-template-columns: 44px 1fr; }
      .item-actions { grid-column: 1 / -1; justify-content: flex-end; }
      .bottom-bar { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <span class="logo-tag">// batch rename</span>
      <span class="logo-title">ImageRename</span>
    </div>
    <span class="header-badge">v1.0.0 beta</span>
  </header>

  <!-- DROP ZONE -->
  <div class="section-label">01 &nbsp;이미지 업로드</div>
  <div id="dropzone">
    <input type="file" id="file-input" multiple accept="image/*" />
    <div class="drop-icon">IMG</div>
    <div class="drop-title">이미지를 드래그하거나 클릭하여 업로드</div>
    <div class="drop-sub">PNG · JPG · WEBP · GIF — 여러 파일 동시 선택 가능</div>
  </div>

  <!-- CONTROLS -->
  <div class="section-label">02 &nbsp;이름 규칙 설정</div>
  <div class="controls-panel">

    <!-- Full name row -->
    <div class="controls-grid">
      <div class="field">
        <span class="field-label">전체 파일명</span>
        <span class="field-hint">키워드 {NB} 사용 시 번호 자동 치환</span>
        <input type="text" id="name-input" placeholder="예) product_{NB}_photo" />
      </div>
      <button class="btn btn-primary" id="apply-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        전체 적용
      </button>
    </div>

    <!-- NB settings -->
    <div class="nb-row">
      <div class="field">
        <span class="field-label">{NB} 시작 번호</span>
        <input type="number" id="nb-start" value="1" min="0" />
      </div>
      <div class="range-sep">→</div>
      <div class="field">
        <span class="field-label">{NB} 끝 번호</span>
        <input type="number" id="nb-end" value="9" min="0" />
      </div>
      <div style="width:12px;"></div>
      <div class="field padding-field">
        <span class="field-label">번호 패딩</span>
        <span class="field-hint">예) 1=1, 2=01, 3=001</span>
        <input type="number" id="nb-pad" value="1" min="1" max="6" />
      </div>
    </div>

  </div>

  <!-- IMAGE LIST -->
  <div class="list-header">
    <div class="section-label" style="margin-bottom:0; flex:1;">03 &nbsp;업로드된 이미지</div>
    <span class="image-count" id="file-count">0개</span>
  </div>

  <div id="image-list"></div>
  <div id="empty-state">업로드된 이미지가 없습니다.</div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar" id="bottom-bar" style="display:none;">
    <span class="bottom-info" id="bottom-info"></span>
    <button class="btn btn-primary" id="download-all-btn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/><rect x="3" y="19" width="18" height="2" rx="1" fill="currentColor" stroke="none"/></svg>
      전체 이미지 다운로드
    </button>
  </div>

</div>

<!-- TOAST -->
<div id="toast"><span class="toast-icon"></span><span id="toast-msg"></span></div>

<script>
  // ── STATE ──
  let files = [];

  // ── ELEMENTS ──
  const dropzone     = document.getElementById('dropzone');
  const fileInput    = document.getElementById('file-input');
  const nameInput    = document.getElementById('name-input');
  const applyBtn     = document.getElementById('apply-btn');
  const nbStart      = document.getElementById('nb-start');
  const nbEnd        = document.getElementById('nb-end');
  const nbPad        = document.getElementById('nb-pad');
  const imageList    = document.getElementById('image-list');
  const fileCount    = document.getElementById('file-count');
  const bottomBar    = document.getElementById('bottom-bar');
  const bottomInfo   = document.getElementById('bottom-info');
  const dlAllBtn     = document.getElementById('download-all-btn');

  // ── DROPZONE ──
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => addFiles(e.target.files));
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    addFiles(e.dataTransfer.files);
  });

  function addFiles(newFiles) {
    [...newFiles].forEach(f => {
      if (!f.type.startsWith('image/')) return;
      files.push({ file: f, renamedName: f.name, url: URL.createObjectURL(f) });
    });
    renderList();
    updateMeta();
  }

  // ── RENDER ──
  function renderList() {
    imageList.innerHTML = '';
    files.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'image-item';
      const ext = getExt(item.file.name);
      div.innerHTML = `
        <div class="thumb-wrap"><img src="${item.url}" alt="" /></div>
        <div class="item-meta">
          <span class="item-index">FILE ${String(i+1).padStart(2,'0')}</span>
          <span class="item-name" id="name-${i}">${escHtml(item.renamedName)}</span>
          <span class="item-original">원본: ${escHtml(item.file.name)}</span>
        </div>
        <div class="item-actions">
          <button class="btn btn-ghost btn-sm" onclick="removeFile(${i})">✕</button>
          <button class="btn btn-success btn-sm" onclick="downloadOne(${i})">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
            다운
          </button>
        </div>`;
      imageList.appendChild(div);
    });
    fileCount.textContent = `${files.length}개`;
    bottomBar.style.display = files.length ? 'flex' : 'none';
    updateMeta();
  }

  function updateMeta() {
    bottomInfo.textContent = `총 ${files.length}개 파일`;
  }

  // ── APPLY ──
  applyBtn.addEventListener('click', applyNames);

  function applyNames() {
    if (!files.length) { showToast('⚠️', '업로드된 이미지가 없습니다'); return; }

    const template = nameInput.value.trim();
    if (!template) { showToast('⚠️', '파일명을 입력해주세요'); return; }

    const start   = parseInt(nbStart.value) || 1;
    const end     = parseInt(nbEnd.value) || 9;
    const pad     = Math.max(1, parseInt(nbPad.value) || 1);
    const hasNB   = template.includes('{NB}');
    const range   = end - start + 1;

    files.forEach((item, i) => {
      const ext = getExt(item.file.name);
      let name = template;
      if (hasNB) {
        const num = start + (i % range);
        name = name.replace('{NB}', String(num).padStart(pad, '0'));
      }
      // append extension if missing
      if (!name.endsWith(`.${ext}`)) name = `${name}.${ext}`;
      item.renamedName = name;
    });

    renderList();
    showToast('✓', `${files.length}개 파일명이 적용되었습니다`);
  }

  // ── REMOVE ──
  function removeFile(i) {
    URL.revokeObjectURL(files[i].url);
    files.splice(i, 1);
    renderList();
    showToast('🗑', '파일이 제거되었습니다');
  }

  // ── JPEG 바이너리에서 모든 메타데이터 세그먼트 제거 후 새 EXIF 삽입 ──
  // APP0(JFIF), APP1(EXIF/XMP), APP2~APP15 전부 제거하고 새로 씀
  async function stripAndInjectExif(blob, title) {
    const buf = await blob.arrayBuffer();
    const src = new Uint8Array(buf);

    // JPEG 시그니처 확인
    if (src[0] !== 0xFF || src[1] !== 0xD8) return blob;

    // ── 1. 모든 APP 세그먼트 제거 (FF E0 ~ FF EF), COM 세그먼트도 제거 ──
    let pos = 2; // SOI 다음부터
    const cleanChunks = [src.slice(0, 2)]; // SOI(FFD8) 보존

    while (pos < src.length - 1) {
      if (src[pos] !== 0xFF) break;
      const marker = src[pos + 1];

      // SOI/EOI는 길이 필드 없음
      if (marker === 0xD8 || marker === 0xD9) { pos += 2; continue; }
      // SOS(FFD A) 이후는 실제 이미지 데이터 — 나머지 전부 복사
      if (marker === 0xDA) {
        cleanChunks.push(src.slice(pos));
        break;
      }

      const segLen = (src[pos + 2] << 8) | src[pos + 3]; // 길이(2바이트 포함)
      const isApp  = marker >= 0xE0 && marker <= 0xEF;
      const isCom  = marker === 0xFE;

      if (isApp || isCom) {
        // 버림
      } else {
        cleanChunks.push(src.slice(pos, pos + 2 + segLen));
      }
      pos += 2 + segLen;
    }

    // ── 2. 새 EXIF APP1 세그먼트 생성 ──
    // 최소 EXIF: IFD0에 ImageDescription + XPTitle만 포함
    function strToBytes(str) {
      return [...str].map(c => c.charCodeAt(0));
    }
    function utf16leBytes(str) {
      const out = [];
      for (const c of str) {
        const code = c.charCodeAt(0);
        out.push(code & 0xff, (code >> 8) & 0xff);
      }
      out.push(0, 0); // null terminator
      return out;
    }
    function u16be(v) { return [(v >> 8) & 0xff, v & 0xff]; }
    function u32be(v) { return [(v >> 24)&0xff,(v>>16)&0xff,(v>>8)&0xff,v&0xff]; }

    const descBytes  = [...strToBytes(title), 0];       // ASCII + null
    const titleBytes = utf16leBytes(title);              // UTF-16LE

    // IFD 엔트리 수: 2 (ImageDescription=0x010E, XPTitle=0x9C9B)
    const numEntries = 2;
    const ifdOffset  = 8;  // 'Exif␀␀' + TIFF 헤더(8바이트) 뒤
    // IFD 크기: 2 + numEntries*12 + 4(next IFD)
    const ifdSize    = 2 + numEntries * 12 + 4;
    const dataOffset = ifdOffset + ifdSize; // 값 데이터 시작 위치 (TIFF 헤더 기준)

    // 값 데이터 배치
    const descOff  = dataOffset;
    const titleOff = dataOffset + descBytes.length;
    // 4바이트 이하면 IFD 안에 인라인, 초과면 오프셋 — 여기선 항상 오프셋 방식
    function ifdEntry(tag, type, count, valueOrOffset) {
      return [...u16be(tag), ...u16be(type), ...u32be(count), ...u32be(valueOrOffset)];
    }

    const ifdEntries = [
      ...ifdEntry(0x010E, 2, descBytes.length,  descOff),   // ImageDescription, ASCII
      ...ifdEntry(0x9C9B, 1, titleBytes.length, titleOff),  // XPTitle, BYTE(UTF-16LE)
    ];

    const tiffHeader = [
      0x4D, 0x4D,             // 'MM' = big-endian
      0x00, 0x2A,             // TIFF magic
      ...u32be(ifdOffset),    // IFD0 offset
    ];

    const ifd = [
      ...u16be(numEntries),
      ...ifdEntries,
      0, 0, 0, 0,             // next IFD = 0
    ];

    const exifHeader = [0x45,0x78,0x69,0x66,0x00,0x00]; // 'Exif␀␀'
    const exifPayload = [
      ...exifHeader,
      ...tiffHeader,
      ...ifd,
      ...descBytes,
      ...titleBytes,
    ];

    const app1Len = exifPayload.length + 2; // 길이 필드 자체 포함
    const app1Seg = [0xFF, 0xE1, ...u16be(app1Len), ...exifPayload];

    // ── 3. 조립: SOI + APP1 + 나머지 ──
    const soi      = cleanChunks[0];          // FFD8
    const rest     = cleanChunks.slice(1);    // 정리된 나머지
    const restLen  = rest.reduce((s, c) => s + c.length, 0);
    const out      = new Uint8Array(2 + app1Seg.length + restLen);
    out.set(soi, 0);
    out.set(app1Seg, 2);
    let off = 2 + app1Seg.length;
    for (const chunk of rest) { out.set(chunk, off); off += chunk.length; }

    return new Blob([out], { type: 'image/jpeg' });
  }

  // ── CANVAS RE-EXPORT + 메타데이터 완전 교체 ──
  function reExportBlob(item) {
    return new Promise((resolve, reject) => {
      const ext = getExt(item.renamedName);
      const mimeMap = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/png' };
      const mime = mimeMap[ext] || 'image/png';
      const baseName = item.renamedName.replace(/\.[^.]+$/, '');

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width  = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);

        canvas.toBlob(async blob => {
          if (!blob) return reject(new Error('toBlob failed'));
          try {
            if (mime === 'image/jpeg') {
              // 모든 APP 세그먼트 제거 후 새 EXIF(제목만) 삽입
              const cleaned = await stripAndInjectExif(blob, baseName);
              resolve(cleaned);
            } else {
              resolve(blob);
            }
          } catch(e) {
            resolve(blob); // 실패 시 원본 반환
          }
        }, mime, 0.95);
      };
      img.onerror = reject;
      img.src = item.url;
    });
  }

  // ── Service Worker를 통한 다운로드 (안드로이드 크롬 파일명 강제 적용) ──
  // SW가 등록된 경우: 가상 URL로 fetch → SW가 Content-Disposition 헤더 붙여서 응답
  // SW 미지원/미등록 시: 기존 blob URL 방식으로 폴백

  // SW에 전달할 임시 blob 저장소
  const swBlobStore = new Map();

  function triggerDownload(blob, filename) {
    // Service Worker 방식 시도
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      const id = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
      swBlobStore.set(id, { blob, filename });

      const url = `/sw-download/${id}/${encodeURIComponent(filename)}`;
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      // 30초 후 정리
      setTimeout(() => swBlobStore.delete(id), 30000);
    } else {
      // 폴백: 기존 blob URL 방식
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  }

  // SW fetch 이벤트에서 blob 요청을 받으면 swBlobStore에서 꺼내서 응답
  navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', () => {});
  // SW → 페이지로 blob 요청 중계
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'SW_FETCH_BLOB') {
      const entry = swBlobStore.get(e.data.id);
      if (entry) {
        entry.blob.arrayBuffer().then(buf => {
          e.source.postMessage({
            type: 'SW_BLOB_RESPONSE',
            id: e.data.id,
            filename: entry.filename,
            mime: entry.blob.type,
            buffer: buf
          }, [buf]);
        });
      }
    }
  });

  // Service Worker 등록
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  // ── DOWNLOAD ONE ──
  async function downloadOne(i) {
    const item = files[i];
    try {
      const blob = await reExportBlob(item);
      triggerDownload(blob, item.renamedName);
    } catch (e) {
      showToast('⚠️', '다운로드 중 오류가 발생했습니다');
      console.error(e);
    }
  }

  // ── DOWNLOAD ALL (ZIP) ──
  dlAllBtn.addEventListener('click', async () => {
    if (!files.length) return;

    dlAllBtn.disabled = true;
    dlAllBtn.textContent = '압축 중...';

    try {
      const JSZip = window.JSZip;
      const zip = new JSZip();

      // 파일명 중복 방지용 카운터
      const nameCount = {};

      for (const item of files) {
        const blob = await reExportBlob(item);
        let name = item.renamedName;
        if (nameCount[name] !== undefined) {
          nameCount[name]++;
          const dot = name.lastIndexOf('.');
          name = dot !== -1
            ? name.slice(0, dot) + `_${nameCount[name]}` + name.slice(dot)
            : name + `_${nameCount[name]}`;
        } else {
          nameCount[name] = 0;
        }
        zip.file(name, blob);
      }

      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'images.zip';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      showToast('📦', `${files.length}개 파일이 zip으로 다운로드됩니다`);
    } catch (err) {
      showToast('⚠️', '다운로드 중 오류가 발생했습니다');
      console.error(err);
    } finally {
      dlAllBtn.disabled = false;
      dlAllBtn.innerHTML = `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/><rect x="3" y="19" width="18" height="2" rx="1" fill="currentColor" stroke="none"/></svg> 전체 이미지 다운로드`;
    }
  });

  // ── HELPERS ──
  function getExt(filename) {
    return filename.split('.').pop().toLowerCase();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── TOAST ──
  let toastTimer;
  function showToast(icon, msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.querySelector('.toast-icon').textContent = icon;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
  }
</script>
</body>
