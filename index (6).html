<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ImageRename — 이미지 일괄 이름 변경</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #18181f;
      --border: #2a2a35;
      --border-bright: #3d3d4f;
      --accent: #7c6dfa;
      --accent2: #fa6d9e;
      --accent-glow: rgba(124,109,250,0.25);
      --text: #e8e8f0;
      --text-muted: #6e6e88;
      --text-dim: #3a3a4f;
      --success: #5af0a0;
      --mono: 'DM Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── BACKGROUND NOISE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* ── DECORATIVE GRADIENT ── */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,109,250,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 52px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .logo-tag {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .logo-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-badge {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 100px;
    }

    /* ── SECTION LABELS ── */
    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── UPLOAD ZONE ── */
    #dropzone {
      position: relative;
      border: 1.5px dashed var(--border-bright);
      border-radius: 16px;
      padding: 52px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--surface);
      overflow: hidden;
      margin-bottom: 32px;
    }

    #dropzone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(124,109,250,0.06), transparent 60%);
      pointer-events: none;
    }

    #dropzone:hover, #dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(124,109,250,0.05);
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(124,109,250,0.12);
    }

    #dropzone input { display: none; }

    .drop-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .drop-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .drop-sub {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── CONTROLS PANEL ── */
    .controls-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .field-hint {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    input[type="text"], input[type="number"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    input::placeholder { color: var(--text-dim); }

    .nb-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      gap: 10px;
      align-items: end;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .range-sep {
      font-family: var(--mono);
      font-size: 16px;
      color: var(--text-muted);
      padding-bottom: 10px;
      text-align: center;
    }

    /* ── BUTTONS ── */
    .btn {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 11px 20px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px rgba(124,109,250,0.35);
    }

    .btn-primary:hover {
      background: #9184fb;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(124,109,250,0.45);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: var(--border);
      color: var(--text);
    }

    .btn-sm {
      font-size: 11px;
      padding: 7px 12px;
      border-radius: 6px;
    }

    .btn-success {
      background: rgba(90,240,160,0.12);
      color: var(--success);
      border: 1px solid rgba(90,240,160,0.2);
    }

    .btn-success:hover {
      background: rgba(90,240,160,0.2);
    }

    /* ── IMAGE LIST ── */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .image-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 100px;
    }

    #image-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .image-item {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 14px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      transition: border-color 0.15s, background 0.15s;
      animation: slideIn 0.2s ease forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .image-item:hover { border-color: var(--border-bright); background: var(--surface2); }

    .thumb-wrap {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface2);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .item-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .item-index {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .item-name {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-original {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .bottom-info {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── EMPTY STATE ── */
    #empty-state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 12px;
      display: none;
    }

    #image-list:empty + #empty-state { display: block; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      border-radius: 10px;
      padding: 12px 18px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #toast.show { transform: translateY(0); opacity: 1; }
    #toast .toast-icon { font-size: 14px; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; gap: 16px; }
      .controls-grid { grid-template-columns: 1fr; }
      .nb-row { grid-template-columns: 1fr auto 1fr; grid-template-rows: auto auto; }
      .nb-row .padding-field { grid-column: 1 / -1; }
      .image-item { grid-template-columns: 44px 1fr; }
      .item-actions { grid-column: 1 / -1; justify-content: flex-end; }
      .bottom-bar { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <span class="logo-tag">// batch rename</span>
      <span class="logo-title">ImageRename</span>
    </div>
    <span class="header-badge">v1.0.0 beta</span>
  </header>

  <!-- DROP ZONE -->
  <div class="section-label">01 &nbsp;이미지 업로드</div>
  <div id="dropzone">
    <input type="file" id="file-input" multiple accept="image/*" />
    <div class="drop-icon">IMG</div>
    <div class="drop-title">이미지를 드래그하거나 클릭하여 업로드</div>
    <div class="drop-sub">PNG · JPG · WEBP · GIF — 여러 파일 동시 선택 가능</div>
  </div>

  <!-- CONTROLS -->
  <div class="section-label">02 &nbsp;이름 규칙 설정</div>
  <div class="controls-panel">

    <!-- Full name row -->
    <div class="controls-grid">
      <div class="field">
        <span class="field-label">전체 파일명</span>
        <span class="field-hint">키워드 {NB} 사용 시 번호 자동 치환</span>
        <input type="text" id="name-input" placeholder="예) product_{NB}_photo" />
      </div>
      <button class="btn btn-primary" id="apply-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        전체 적용
      </button>
    </div>

    <!-- NB settings -->
    <div class="nb-row">
      <div class="field">
        <span class="field-label">{NB} 시작 번호</span>
        <input type="number" id="nb-start" value="1" min="0" />
      </div>
      <div class="range-sep">→</div>
      <div class="field">
        <span class="field-label">{NB} 끝 번호</span>
        <input type="number" id="nb-end" value="9" min="0" />
      </div>
      <div style="width:12px;"></div>
      <div class="field padding-field">
        <span class="field-label">번호 패딩</span>
        <span class="field-hint">예) 1=1, 2=01, 3=001</span>
        <input type="number" id="nb-pad" value="1" min="1" max="6" />
      </div>
    </div>

  </div>

  <!-- IMAGE LIST -->
  <div class="list-header">
    <div class="section-label" style="margin-bottom:0; flex:1;">03 &nbsp;업로드된 이미지</div>
    <span class="image-count" id="file-count">0개</span>
  </div>

  <div id="image-list"></div>
  <div id="empty-state">업로드된 이미지가 없습니다.</div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar" id="bottom-bar" style="display:none;">
    <span class="bottom-info" id="bottom-info"></span>
    <button class="btn btn-primary" id="download-all-btn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/><rect x="3" y="19" width="18" height="2" rx="1" fill="currentColor" stroke="none"/></svg>
      전체 이미지 다운로드
    </button>
  </div>

</div>

<!-- TOAST -->
<div id="toast"><span class="toast-icon"></span><span id="toast-msg"></span></div>

<script>
  // ── STATE ──
  let files = [];

  // ── ELEMENTS ──
  const dropzone     = document.getElementById('dropzone');
  const fileInput    = document.getElementById('file-input');
  const nameInput    = document.getElementById('name-input');
  const applyBtn     = document.getElementById('apply-btn');
  const nbStart      = document.getElementById('nb-start');
  const nbEnd        = document.getElementById('nb-end');
  const nbPad        = document.getElementById('nb-pad');
  const imageList    = document.getElementById('image-list');
  const fileCount    = document.getElementById('file-count');
  const bottomBar    = document.getElementById('bottom-bar');
  const bottomInfo   = document.getElementById('bottom-info');
  const dlAllBtn     = document.getElementById('download-all-btn');

  // ── DROPZONE ──
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => addFiles(e.target.files));
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    addFiles(e.dataTransfer.files);
  });

  function addFiles(newFiles) {
    [...newFiles].forEach(f => {
      if (!f.type.startsWith('image/')) return;
      files.push({ file: f, renamedName: f.name, url: URL.createObjectURL(f) });
    });
    renderList();
    updateMeta();
  }

  // ── RENDER ──
  function renderList() {
    imageList.innerHTML = '';
    files.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'image-item';
      const ext = getExt(item.file.name);
      div.innerHTML = `
        <div class="thumb-wrap"><img src="${item.url}" alt="" /></div>
        <div class="item-meta">
          <span class="item-index">FILE ${String(i+1).padStart(2,'0')}</span>
          <span class="item-name" id="name-${i}">${escHtml(item.renamedName)}</span>
          <span class="item-original">원본: ${escHtml(item.file.name)}</span>
        </div>
        <div class="item-actions">
          <button class="btn btn-ghost btn-sm" onclick="removeFile(${i})">✕</button>
          <button class="btn btn-success btn-sm" onclick="downloadOne(${i})">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
            다운
          </button>
        </div>`;
      imageList.appendChild(div);
    });
    fileCount.textContent = `${files.length}개`;
    bottomBar.style.display = files.length ? 'flex' : 'none';
    updateMeta();
  }

  function updateMeta() {
    bottomInfo.textContent = `총 ${files.length}개 파일`;
  }

  // ── APPLY ──
  applyBtn.addEventListener('click', applyNames);

  function applyNames() {
    if (!files.length) { showToast('⚠️', '업로드된 이미지가 없습니다'); return; }

    const template = nameInput.value.trim();
    if (!template) { showToast('⚠️', '파일명을 입력해주세요'); return; }

    const start   = parseInt(nbStart.value) || 1;
    const end     = parseInt(nbEnd.value) || 9;
    const pad     = Math.max(1, parseInt(nbPad.value) || 1);
    const hasNB   = template.includes('{NB}');
    const range   = end - start + 1;

    files.forEach((item, i) => {
      const ext = getExt(item.file.name);
      let name = template;
      if (hasNB) {
        const num = start + (i % range);
        name = name.replace('{NB}', String(num).padStart(pad, '0'));
      }
      // append extension if missing
      if (!name.endsWith(`.${ext}`)) name = `${name}.${ext}`;
      item.renamedName = name;
    });

    renderList();
    showToast('✓', `${files.length}개 파일명이 적용되었습니다`);
  }

  // ── REMOVE ──
  function removeFile(i) {
    URL.revokeObjectURL(files[i].url);
    files.splice(i, 1);
    renderList();
    showToast('🗑', '파일이 제거되었습니다');
  }

  // ── EXIF 제목 필드를 새 이름으로 덮어쓰는 헬퍼 ──
  function rewriteExifTitle(dataUrl, newTitle) {
    try {
      if (!window.piexif) return dataUrl;
      const exifObj = piexif.load(dataUrl);
      if (exifObj['0th']) {
        // ImageDescription (ASCII)
        exifObj['0th'][piexif.ImageIFD.ImageDescription] = newTitle;
        // XPTitle (Windows용 UTF-16LE 바이트 배열)
        const utf16 = [];
        for (let c of newTitle) {
          const code = c.charCodeAt(0);
          utf16.push(code & 0xff, (code >> 8) & 0xff);
        }
        utf16.push(0, 0);
        exifObj['0th'][piexif.ImageIFD.XPTitle] = utf16;
      }
      const exifBytes = piexif.dump(exifObj);
      return piexif.insert(exifBytes, dataUrl);
    } catch (e) {
      return dataUrl;
    }
  }

  // ── CANVAS RE-EXPORT + EXIF 제목 수정 ──
  function reExportBlob(item) {
    return new Promise((resolve, reject) => {
      const ext = getExt(item.renamedName);
      const mimeMap = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/png' };
      const mime = mimeMap[ext] || 'image/png';
      const baseName = item.renamedName.replace(/\.[^.]+$/, '');

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width  = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);

        canvas.toBlob(blob => {
          if (!blob) return reject(new Error('toBlob failed'));

          if (mime === 'image/jpeg') {
            const reader = new FileReader();
            reader.onload = () => {
              const updated = rewriteExifTitle(reader.result, baseName);
              const byteStr = atob(updated.split(',')[1]);
              const ab = new Uint8Array(byteStr.length);
              for (let i = 0; i < byteStr.length; i++) ab[i] = byteStr.charCodeAt(i);
              resolve(new Blob([ab], { type: mime }));
            };
            reader.onerror = () => resolve(blob);
            reader.readAsDataURL(blob);
          } else {
            resolve(blob);
          }
        }, mime, 0.95);
      };
      img.onerror = reject;
      img.src = item.url;
    });
  }

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ── DOWNLOAD ONE ──
  async function downloadOne(i) {
    const item = files[i];
    try {
      const blob = await reExportBlob(item);
      triggerDownload(blob, item.renamedName);
    } catch (e) {
      showToast('⚠️', '다운로드 중 오류가 발생했습니다');
      console.error(e);
    }
  }

  // ── DOWNLOAD ALL (ZIP) ──
  dlAllBtn.addEventListener('click', async () => {
    if (!files.length) return;

    dlAllBtn.disabled = true;
    dlAllBtn.textContent = '압축 중...';

    try {
      const JSZip = window.JSZip;
      const zip = new JSZip();

      // 파일명 중복 방지용 카운터
      const nameCount = {};

      for (const item of files) {
        const blob = await reExportBlob(item);
        let name = item.renamedName;
        if (nameCount[name] !== undefined) {
          nameCount[name]++;
          const dot = name.lastIndexOf('.');
          name = dot !== -1
            ? name.slice(0, dot) + `_${nameCount[name]}` + name.slice(dot)
            : name + `_${nameCount[name]}`;
        } else {
          nameCount[name] = 0;
        }
        zip.file(name, blob);
      }

      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'images.zip';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      showToast('📦', `${files.length}개 파일이 zip으로 다운로드됩니다`);
    } catch (err) {
      showToast('⚠️', '다운로드 중 오류가 발생했습니다');
      console.error(err);
    } finally {
      dlAllBtn.disabled = false;
      dlAllBtn.innerHTML = `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/><rect x="3" y="19" width="18" height="2" rx="1" fill="currentColor" stroke="none"/></svg> 전체 이미지 다운로드`;
    }
  });

  // ── HELPERS ──
  function getExt(filename) {
    return filename.split('.').pop().toLowerCase();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── TOAST ──
  let toastTimer;
  function showToast(icon, msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    toast.querySelector('.toast-icon').textContent = icon;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
  }
</script>
</body>
</html>
